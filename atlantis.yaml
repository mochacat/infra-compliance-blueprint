# ─────────────────────────────────────────────────────────────────────────────
# atlantis.yaml — OpenTofu monorepo Atlantis configuration
#
# REFERENCE PATTERN — adapt to your actual Atlantis server deployment.
# Account IDs, workflow names, and approval rules must reflect your org.
#
# Dependency model:
#   Within each environment/BU, layers are applied in a strict order defined
#   by ssm-contract.yaml (iam -> network -> data -> compute -> ai). Each layer
#   publishes SSM parameters that downstream layers consume. If an upstream
#   layer's plan shows changes, ALL downstream layers are flagged for
#   re-planning before apply.
#
#   This config uses Atlantis v0.27+ workflow_mode: multi so that a single
#   PR touching multiple layers runs them as a coordinated batch. The OPA
#   SSM contract check at plan time validates that no layer would consume
#   stale or missing parameters.
#
#   A pre-apply script (scripts/check-ssm-drift.sh) verifies that the SSM
#   parameters the plan was generated against still match what's in Parameter
#   Store -- preventing applies with stale plans after an upstream change.
#
# Landing zone and hub projects do not have SSM dependencies between them.
# ─────────────────────────────────────────────────────────────────────────────

version: 3

# Workflow mode: "multi" tells Atlantis that a single PR can contain changes
# to multiple projects. Atlantis plans them in parallel and shows them in one
# PR comment. Apply ordering is enforced by the SSM drift check script.
# Requires Atlantis v0.27+.
workflow_mode: multi

automerge: false

# Global autoplan settings. Each project can override.
autoplan:
  when_modified:
    - "environments/**/*.tf"
    - "environments/**/*.tfvars"
    - "landing-zone/**/*.tf"
    - "landing-zone/**/*.tfvars"
    - "modules/**/*.tf"
    - "modules/**/*.tfvars"
  enabled: true

# ── Workflows ───────────────────────────────────────────────────────────────
#
# Every workflow runs:
#   1. tofu init + plan
#   2. OPA evaluation against module policies
#   3. SSM contract check (if the project is a layer in the SSM contract)
#   4. Downstream dependency check (flags layers that need re-planning)
#   5. SSM drift check before apply (verifies consumed params still exist)
#   6. tofu test before apply
#
# Dev = auto-apply, Preprod = 1 approval, Production = 2 approvals.
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  # ── Dev workflow -- auto-apply on merge ─────────────────────────────────
  dev:
    plan:
      steps:
        - run: tofu init -input=false -backend-config=backend.hcl
        - run: tofu workspace select default 2>/dev/null || tofu workspace new default
        - run: tofu plan -input=false -out=$PLANFILE
        - run: tofu show -json $PLANFILE > $SHOWFILE
        - run: |
            if [ -d "$(dirname $PLANFILE)/policies" ]; then
              echo "::group::OPA Policy Check"
              opa eval --format pretty \
                --data "$(dirname $PLANFILE)/policies/" \
                --stdin-input "$SHOWFILE" \
                "data.terraform.deny" || exit 1
              echo "::endgroup::"
            fi
        - run: |
            if [ -f "$REPO_ROOT/ssm-contract.json" ]; then
              echo "::group::SSM Contract Check"
              opa eval --format pretty \
                --data "$REPO_ROOT/policies/ssm-contract.rego" \
                --data "$REPO_ROOT/ssm-contract.json" \
                --stdin-input "$SHOWFILE" \
                "data.terraform.deny" || exit 1
              echo "::endgroup::"
            fi
        - run: |
            if [ -f "$REPO_ROOT/scripts/check-downstream.sh" ]; then
              $REPO_ROOT/scripts/check-downstream.sh "$(dirname $PLANFILE)" "$SHOWFILE"
            fi
    apply:
      steps:
        - run: |
            if [ -f "$REPO_ROOT/scripts/check-ssm-drift.sh" ]; then
              $REPO_ROOT/scripts/check-ssm-drift.sh "$(dirname $PLANFILE)"
            fi
        - run: tofu test -test-directory=tests 2>/dev/null || echo "No tests -- skipping"
        - run: tofu apply $PLANFILE

  # ── Preprod workflow -- 1 approval required ────────────────────────────
  preprod:
    plan:
      steps:
        - run: tofu init -input=false -backend-config=backend.hcl
        - run: tofu workspace select default 2>/dev/null || tofu workspace new default
        - run: tofu plan -input=false -out=$PLANFILE
        - run: tofu show -json $PLANFILE > $SHOWFILE
        - run: |
            if [ -d "$(dirname $PLANFILE)/policies" ]; then
              echo "::group::OPA Policy Check"
              opa eval --format pretty \
                --data "$(dirname $PLANFILE)/policies/" \
                --stdin-input "$SHOWFILE" \
                "data.terraform.deny" || exit 1
              echo "::endgroup::"
            fi
        - run: |
            if [ -f "$REPO_ROOT/ssm-contract.json" ]; then
              echo "::group::SSM Contract Check"
              opa eval --format pretty \
                --data "$REPO_ROOT/policies/ssm-contract.rego" \
                --data "$REPO_ROOT/ssm-contract.json" \
                --stdin-input "$SHOWFILE" \
                "data.terraform.deny" || exit 1
              echo "::endgroup::"
            fi
        - run: |
            if [ -f "$REPO_ROOT/scripts/check-downstream.sh" ]; then
              $REPO_ROOT/scripts/check-downstream.sh "$(dirname $PLANFILE)" "$SHOWFILE"
            fi
    apply:
      steps:
        - run: |
            if [ -f "$REPO_ROOT/scripts/check-ssm-drift.sh" ]; then
              $REPO_ROOT/scripts/check-ssm-drift.sh "$(dirname $PLANFILE)"
            fi
        - run: tofu test -test-directory=tests 2>/dev/null || echo "No tests -- skipping"
        - run: tofu apply $PLANFILE
    policy_check: true

  # ── Production workflow -- 2 approvals required ────────────────────────
  production:
    plan:
      steps:
        - run: tofu init -input=false -backend-config=backend.hcl
        - run: tofu workspace select default 2>/dev/null || tofu workspace new default
        - run: tofu plan -input=false -out=$PLANFILE
        - run: tofu show -json $PLANFILE > $SHOWFILE
        - run: |
            if [ -d "$(dirname $PLANFILE)/policies" ]; then
              echo "::group::OPA Policy Check"
              opa eval --format pretty \
                --data "$(dirname $PLANFILE)/policies/" \
                --stdin-input "$SHOWFILE" \
                "data.terraform.deny" || exit 1
              echo "::endgroup::"
            fi
        - run: |
            if [ -f "$REPO_ROOT/ssm-contract.json" ]; then
              echo "::group::SSM Contract Check"
              opa eval --format pretty \
                --data "$REPO_ROOT/policies/ssm-contract.rego" \
                --data "$REPO_ROOT/ssm-contract.json" \
                --stdin-input "$SHOWFILE" \
                "data.terraform.deny" || exit 1
              echo "::endgroup::"
            fi
        - run: |
            if [ -f "$REPO_ROOT/scripts/check-downstream.sh" ]; then
              $REPO_ROOT/scripts/check-downstream.sh "$(dirname $PLANFILE)" "$SHOWFILE"
            fi
    apply:
      steps:
        - run: |
            if [ -f "$REPO_ROOT/scripts/check-ssm-drift.sh" ]; then
              $REPO_ROOT/scripts/check-ssm-drift.sh "$(dirname $PLANFILE)"
            fi
        - run: tofu test -test-directory=tests 2>/dev/null || echo "No tests -- skipping"
        - run: tofu apply $PLANFILE
    policy_check: true


# ═══════════════════════════════════════════════════════════════════════════
# PROJECTS
# ═══════════════════════════════════════════════════════════════════════════
#
# Each project maps a directory to a workflow. Within each environment/BU
# group, the SSM contract defines the apply order. The comments reference
# the apply_order from ssm-contract.json.
#
# Naming convention: <env>/<bu>-<layer>
#   e.g. prod/platform-iam, dev/research-network, hub/network
#
# Landing zone projects:
#   mgmt/bootstrap  - Org, OUs, SCPs, accounts (management account 111122223333)
#   logarchive/baseline - CloudTrail, GuardDuty (log archive account 444455556666)
#
# Hub projects (infra-control-plane, account 777788889999):
#   hub/transit-gateway -> hub/network -> hub/endpoints
#
# Workload projects per environment/BU (SSM apply order):
#   <env>/<bu>-iam(1) -> <env>/<bu>-network(2) -> <env>/<bu>-data(3)
#   -> <env>/<bu>-compute(4) -> <env>/<bu>-ai(5)
# ═══════════════════════════════════════════════════════════════════════════

projects:
  # ═════════════════════════════════════════════════════════════════════════
  # LANDING ZONE
  # ═════════════════════════════════════════════════════════════════════════

  - name: mgmt/bootstrap
    dir: landing-zone/bootstrap
    workspace: default
    workflow: production
    autoplan:
      when_modified:
        - "landing-zone/bootstrap/**"
        - "modules/**"
    apply_requirements:
      - approved
      - mergeable

  - name: logarchive/baseline
