  # ═════════════════════════════════════════════════════════════════════════
  # INFRA CONTROL PLANE -- Network Hub Account (777788889999)
  # Apply order: transit-gateway(1) -> network(2) -> endpoints(3)
  # ═════════════════════════════════════════════════════════════════════════

